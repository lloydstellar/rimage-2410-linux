{% extends "base.html" %}
{% block title %}Log in · Rimage 2410{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post">
    <label>Access code <input type="password" name="code" autofocus autocomplete="current-password"></label>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <button type="submit" class="primary">Log in</button>
  </form>
</section>
{% endblock %}
